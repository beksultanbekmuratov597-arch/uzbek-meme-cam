<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Uzbek Meme Cam</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <div>
        <span class="eyebrow">UZBEK MEME CAM</span>
        <h1>Qo‘l ishorasi → o‘zbekcha reaksiya</h1>
      </div>
      <div id="status" class="status">Yuklanmoqda…</div>
    </header>

    <section class="grid">
      <div class="panel camera-panel">
        <div class="panel-title">KAMERA</div>
        <div class="stage">
          <video id="camera" autoplay muted playsinline></video>
          <canvas id="overlay"></canvas>
          <div id="cameraHint" class="hint">Kameraga qo‘lingizni ko‘rsating</div>
        </div>
        <div class="meters">
          <span>Gesture: <b id="gesture">—</b></span>
          <span>Confidence: <b id="confidence">0%</b></span>
        </div>
        <div class="tutorial" aria-label="Gesture tutorial">
          <div class="tutorial-copy">
            <span class="tutorial-kicker">QANDAY ISHLAYDI</span>
            <strong>Qo‘lingiz bilan gesture ko‘rsating</strong>
          </div>
          <div class="gesture-chips">
            <div class="gesture-chip" data-gesture="thumbs_up"><span>👍</span><small>Thumbs up</small></div>
            <div class="gesture-chip" data-gesture="peace"><span>✌️</span><small>Peace</small></div>
            <div class="gesture-chip" data-gesture="pinch"><span>🤏</span><small>Pinch</small></div>
            <div class="gesture-chip" data-gesture="fist"><span>✊</span><small>Fist</small></div>
            <div class="gesture-chip" data-gesture="point"><span>👉</span><small>Point</small></div>
            <div class="gesture-chip" data-gesture="shaka"><span>🤙</span><small>Shaka</small></div>
            <div class="gesture-chip" data-gesture="rock"><span>🤘</span><small>Rock</small></div>
            <div class="gesture-chip" data-gesture="open_palm"><span>✋</span><small>Open palm</small></div>
            <div class="gesture-chip" data-gesture="double_fist"><span>✊✊</span><small>Double fist</small></div>
            <div class="gesture-chip" data-gesture="palms_up"><span>🤲</span><small>Palms up</small></div>
          </div>
        </div>
      </div>

      <div class="panel reaction-panel">
        <div class="panel-title">REAKSIYA</div>
        <div class="meme-wrap">
          <img id="memeImage" alt="Uzbek meme reaction" />
          <video id="memeVideo" autoplay loop muted playsinline></video>
          <div class="caption" id="caption"></div>
        </div>
        <div class="help">
          <span>1–0: test</span>
          <span>D: demo</span>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
